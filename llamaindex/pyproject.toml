[project]
name = "llama-index-tools-zurchin"
version = "1.2.1"
description = "Zurchin as a LlamaIndex tool spec. Email for founders, teams and agents: send, wait for the reply and answer in the thread, on @zurchin.email or your domain."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Zurchin" }]
keywords = ["email", "inbox", "ai-agents", "agent-email", "llama-index", "pidgeon"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]
dependencies = ["zurchin>=2.16.1,<3", "llama-index-core>=0.13.0,<0.15"]

[project.urls]
Homepage = "https://zurchin.com"
Documentation = "https://zurchin.com/docs"
Repository = "https://github.com/zurchin/pidgeon-python/tree/main/llamaindex"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `llama_index` and `llama_index.tools` are namespace packages, shared with
# every other LlamaIndex integration: no `__init__.py` in either.
[tool.hatch.build.targets.wheel]
packages = ["src/llama_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# What LlamaHub reads from an integration package.
[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.zurchin"

[tool.llamahub.class_authors]
PidgeonToolSpec = "pidgeon-ai"
