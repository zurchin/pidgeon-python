[project]
name = "zurchin"
version = "2.16.1"
description = "Zurchin's Python SDK. Email for founders, teams and agents: inboxes for your AI agents beside your team's, on @zurchin.email or your own domains, with threads, webhooks and calendars."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Zurchin" }]
keywords = ["email", "inbox", "ai-agents", "agent-email", "team-inbox", "unified-inbox", "email-api", "openid-connect"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Email",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=42", "httpx>=0.27"]

[project.urls]
Homepage = "https://zurchin.com"
Repository = "https://github.com/zurchin/pidgeon-python"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zurchin"]

# In the pidgeon-python mirror this directory is the root, beside langchain/
# and llamaindex/: name what the sdist takes, or it takes them too.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
