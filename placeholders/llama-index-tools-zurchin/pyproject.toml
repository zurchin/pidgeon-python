[project]
name = "llama-index-tools-zurchin"
version = "0.0.1"
description = "Reserved for Zurchin (formerly Pidgeon). Use llama-index-tools-pidgeon until the switch."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Pidgeon" }]

[project.urls]
Homepage = "https://pypi.org/project/llama-index-tools-pidgeon/"
Repository = "https://github.com/pidgeon-ai/pidgeon-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_index"]
