[project]
name = "langchain-pidgeon"
version = "1.2.0"
description = "Now langchain-zurchin: Pidgeon is now Zurchin. This last release re-exports it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["langchain-zurchin==1.2.0"]

[project.urls]
Homepage = "https://pypi.org/project/langchain-zurchin/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_pidgeon"]
