[project]
name = "pidgeon"
version = "2.16.0"
description = "Now zurchin: Pidgeon is now Zurchin. This last release re-exports it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["zurchin==2.16.0"]

[project.urls]
Homepage = "https://pypi.org/project/zurchin/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pidgeon"]
