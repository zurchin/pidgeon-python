name: Publish

# Tag-driven, one PyPI project per tag prefix; `release.json` (written by
# every sync) says which directory each prefix publishes. Before the switch to
# Zurchin:
#
#   python-v2.0.0       pidgeon                     from the root
#   langchain-v1.0.0    langchain-pidgeon           from langchain/
#   llamaindex-v1.0.0   llama-index-tools-pidgeon   from llamaindex/
#
# Until then, `zurchin-python-v*`, `zurchin-langchain-v*` and
# `zurchin-llamaindex-v*` are the 0.0.1 placeholders that claimed those names,
# from placeholders/<name>/.
#
# After it, `zurchin-python-v*`, `zurchin-langchain-v*` and
# `zurchin-llamaindex-v*` publish zurchin, langchain-zurchin and
# llama-index-tools-zurchin from those same places, and the old prefixes the
# last Pidgeon releases, which re-export them, from pidgeon/<prefix>/.
#
# The release job in the private repository (`scripts/release.ts`) cuts the
# tags after the sync that put this tree here succeeded.
#
# This file is generated from `mirrors/python/` in the private repository and
# overwritten on every sync: change it there.
#
# No PyPI token exists anywhere: trusted publishing exchanges this job's OIDC
# token, and the upload carries PEP 740 attestations pointing at this public
# commit. Each project has its own trusted publisher, and each names this
# repository, this workflow and the `pypi` environment. A version PyPI
# already has is skipped.
on:
  push:
    tags:
      - 'python-v*'
      - 'langchain-v*'
      - 'llamaindex-v*'
      - 'zurchin-python-v*'
      - 'zurchin-langchain-v*'
      - 'zurchin-llamaindex-v*'
  workflow_dispatch:
    inputs:
      package:
        description: Which project to publish, by its tag prefix in release.json (python, zurchin-python, …)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The environment PyPI's trusted publishers are pinned to, so no other
    # workflow here can upload.
    environment: pypi
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - name: Which project
        id: project
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          key="${PACKAGE:-${GITHUB_REF_NAME%%-v*}}"
          dir=$(jq -r --arg k "$key" '.[$k].dir // empty' release.json)
          if [ -z "$dir" ]; then
            echo "release.json has no project for $key." >&2
            exit 1
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: The tag matches the version
        if: github.event_name == 'push'
        env:
          KEY: ${{ steps.project.outputs.key }}
          DIR: ${{ steps.project.outputs.dir }}
        run: |
          declared=$(grep -m1 '^version = ' "$DIR/pyproject.toml" | cut -d'"' -f2)
          tagged="${GITHUB_REF_NAME#"$KEY"-v}"
          if [ "$declared" != "$tagged" ]; then
            echo "Tag says $tagged; $DIR/pyproject.toml says $declared." >&2
            exit 1
          fi

      # The last Pidgeon releases only re-export, and have no tests of their own.
      - name: Test
        if: hashFiles(format('{0}/tests/**', steps.project.outputs.dir)) != ''
        run: uv run --directory "${{ steps.project.outputs.dir }}" pytest

      - name: Build
        run: uv build --directory "${{ steps.project.outputs.dir }}" --out-dir "$GITHUB_WORKSPACE/dist"

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true
